# APK prod na GitHub Releases — kanał EAS Update: production
name: Build Android APK (production)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (profile github → production)
        run: eas build --profile github --platform android --non-interactive

      # Opcjonalnie: pobierz artefakt i dołącz do Release — wymaga eas build --local lub API;
      # domyślnie link do APK jest w panelu expo.dev po zakończeniu builda.
